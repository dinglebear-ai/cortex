name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  artifacts:
    name: Build hosted x86_64 artifacts
    uses: dinglebear-ai/workflows/.github/workflows/hosted-rust-platform-release.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      toolchain: "1.97.1"
      targets-json: >-
        [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
         {"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]
      build-command: cargo build --release --locked --target "$TARGET" --bin cortex
      package-command: |
        set -euo pipefail
        mkdir -p dist
        if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
          7z a "dist/cortex-windows-x86_64.zip" ".cache/cargo/$TARGET/release/cortex.exe"
          (cd dist && sha256sum cortex-windows-x86_64.zip > cortex-windows-x86_64.zip.sha256)
        else
          tar -C ".cache/cargo/$TARGET/release" -czf "dist/cortex-linux-x86_64.tar.gz" cortex
          (cd dist && sha256sum cortex-linux-x86_64.tar.gz > cortex-linux-x86_64.tar.gz.sha256)
        fi
      artifact-path: dist/*
      artifact-prefix: cortex

  github-release:
    name: Attach verified artifacts
    needs: [artifacts]
    uses: dinglebear-ai/workflows/.github/workflows/github-release.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      release-tag: ${{ github.event.release.tag_name }}
      artifact-pattern: cortex-*

  npm:
    name: Publish npm launcher
    needs: [metadata, github-release]
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      expected-version: ${{ needs.metadata.outputs.version }}
      working-directory: packages/cortex-rmcp
      enable-cache: false
      install-command: ""
      verify-command: npm test && npm run check && npm pack --dry-run --json
