name: Repository contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    permissions:
      contents: read
    # Keep the immutable shared implementation on a hosted runner. Cortex
    # replaces only its legacy CLAUDE-canonical rule with the tested AGENTS rule.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: target
          persist-credentials: false
      - name: Check out immutable contract implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dinglebear-ai/workflows
          ref: d1a41a7af9c41189e0f1062234364f5814bda99d
          path: workflow-library
          persist-credentials: false
      - name: Test repository contract adapter
        run: python3 target/scripts/test-repository-contract.py
      - name: Validate repository contract
        run: >-
          python3 target/scripts/check-repository-contract.py
          --implementation workflow-library/scripts/fleet_contract.py
          --repo target
          --profile rust

  repository-contract:
    name: Repository Contract
    if: always()
    needs: [contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require repository contract
        env:
          RESULT: ${{ needs.contract.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "repository contract concluded $RESULT" >&2
            exit 1
          fi
