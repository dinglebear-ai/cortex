# =============================================================================
# .cargo/config.toml — Cargo workspace configuration for cortex
#
# Most build settings (linker, profile tuning, jobs) live in the developer's
# ~/.cargo/config.toml. This file only adds workspace-local settings that the
# global config cannot provide.
#
# See docs/RUST.md for expected global config and system tool requirements.
# See https://github.com/jmagar/rmcp-template/blob/main/docs/RUST.md for the
# canonical family reference.
# =============================================================================

[alias]
# Release-version maintenance, driven by release/components.toml.
#   cargo xtask check-version-sync       — every version file agrees
#   cargo xtask check-release-versions   — sync + CHANGELOG entry (release gate)
#   cargo xtask bump-version <level>     — bump patch|minor|major everywhere
xtask = "run --quiet --package xtask --"

[build]
# Non-standard target directory keeps Cargo artifacts out of the repo root so
# Docker COPY instructions and bind mounts don't require an exclude for ./target.
# See docs/RUST.md §Repo-specific overrides.
target-dir = ".cache/cargo"
