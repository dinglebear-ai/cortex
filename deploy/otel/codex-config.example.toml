# Template: render with scripts/render-deploy-templates.sh after sourcing
# deploy/hosts.env. Do not append this unrendered file directly.
# Endpoint targets the configured cortex host. Phase 1 of the
# OTLP receiver must be deployed first.
#
# Caveat: codex `exec` and `mcp-server` emit no telemetry. Only interactive
# codex sessions do. The JSONL transcript pipeline (40-ai-transcripts.conf)
# covers what OTel misses.
#
# trace_exporter is omitted because cortex's /v1/traces returns 404
# (deferred — see CHANGELOG 0.11.0 for rationale).

[otel]
environment = "homelab"
log_user_prompt = true
exporter = { otlp-http = { endpoint = "${CORTEX_OTLP_ENDPOINT}/v1/logs", protocol = "binary" } }
