# /etc/rsyslog.d/36-adguard.conf
# Tail AdGuard's JSON query log. High volume — deploy LAST after authelia
# and SWAG configs are confirmed stable.
#
# Deploy on: edgehost only.
#
# Source path verified on edgehost:
#   find /mnt /opt /srv -name 'querylog.json' 2>/dev/null
# Current edgehost path: /mnt/appdata/adguard/var/data/querylog.json
#
# Tag classification (adguard-blocked / adguard-allowed / adguard-rewrite)
# happens at cortex ingest by parsing the JSON Result.IsFiltered and
# Reason fields. Optionally set CORTEX_ADGUARD_SOURCE_IP=<edgehost-ip>
# in cortex's environment to gate this enrichment to edgehost only.
#
# Tag-based retention (Phase 2) purges adguard-allowed/query/rewrite at 7d
# regardless of the global retention_days setting.

input(type="imfile"
      File="/mnt/appdata/adguard/var/data/querylog.json"
      Tag="adguard-query"
      Facility="local6"
      Severity="info"
      FreshStartTail="on"
      PersistStateInterval="500")
