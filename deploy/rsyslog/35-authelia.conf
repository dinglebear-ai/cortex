# /etc/rsyslog.d/35-authelia.conf
# Tail Authelia's structured log file. We deliberately keep Authelia
# file-based rather than redirecting to stdout so a cortex outage cannot
# disturb a live auth stack.
#
# Deploy on: edgehost only.
#
# Source path verified on edgehost:
#   find /mnt /opt /srv -name 'authelia.log' 2>/dev/null
# Current edgehost path: /mnt/appdata/authelia/logs/authelia.log
#
# startmsg.regex='^time=' gloms multi-line panics + stack traces into a single
# syslog message instead of fragmenting them.
#
# Severity reclassification (info → warning/err/crit) happens at cortex
# ingest by parsing 'level=' from the message body.

input(type="imfile"
      File="/mnt/appdata/authelia/logs/authelia.log"
      Tag="authelia"
      Facility="local5"
      Severity="info"
      startmsg.regex="^time="
      FreshStartTail="on"
      PersistStateInterval="100")
